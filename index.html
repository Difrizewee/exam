let view = { name:'home' };
let test = null;
let observer = null;

function go(next, opts){
  if(observer){ observer.disconnect(); observer = null; }
  view = next;
  render();
  if(!(opts && opts.keepScroll)) window.scrollTo(0, 0);
}

backBtn.addEventListener('click', () => {
  if(view.name === 'section') go({name:'learn'});
  else go({name:'home'});
});

function setLevel(lv){
  if(lv === level) return;
  level = lv;
  store.set(KEY_LEVEL, lv);
  const back = { section:'learn', test:'home', result:'home' };
  go({ name: back[view.name] || view.name });
}

function setChrome(){
  const isHome = view.name === 'home';
  backBtn.hidden = isHome;
  backLabel.textContent =
    view.name === 'section' ? 'К разделам' :
    (view.name === 'test' || view.name === 'result') ? 'Выйти' : 'На главную';
  lvlChipText.textContent = L().name;
}

function render(){
  setChrome();
  const v = {
    home:viewHome, learn:viewLearn, section:() => viewSection(view.id),
    picker:viewPicker, test:viewTest, result:viewResult
  }[view.name];
  app.innerHTML = v ? v() : '';
  bind();
}

/* =========================================================================
   Сегмент-контрол уровня
   ========================================================================= */
function levelSwitch(hint){
  const b = Object.keys(LEVELS).map(lv => `
    <button data-level="${lv}" aria-pressed="${lv === level}">${esc(LEVELS[lv].name)}</button>`).join('');
  return `
    <div class="seg" role="group" aria-label="Уровень подготовки">${b}</div>
    ${hint ? `<p class="seg-hint">${esc(hint)}</p>` : ''}`;
}

/* =========================================================================
   Экран: Главная
   ========================================================================= */
function viewHome(){
  const avg = averageScore();
  const pct = avg === null ? 0 : avg;
  const R = 84, C = 2 * Math.PI * R;

  const list = theory().map(s => {
    const done = !!P().read[s.id];
    const best = P().best[s.id];
    const n = questionsFor(s.id).length;
    return `
      <button class="sec-item" data-go="section" data-id="${esc(s.id)}">
        <span class="tick ${done ? 'on' : ''}" aria-hidden="true">${IC.check}</span>
        <span class="sec-body">
          <span class="sec-name">${esc(s.title)}</span>
          <span class="sec-meta">
            <span>${done ? 'Прочитано' : 'Ещё не читали'}</span>
            <span>${n} вопрос${plural(n,'','а','ов')}</span>
            ${typeof best === 'number' ? `<span class="sec-score">Лучший тест: ${best}%</span>` : ''}
          </span>
          ${s.recommendedFirst ? '<span class="badge">Рекомендуем начать отсюда</span>' : ''}
        </span>
      </button>`;
  }).join('');

  const taken = testsTaken();

  return `
  <div class="screen">
    <div class="hero">
      <h1>Готовимся спокойно</h1>
      <p class="lead">Экзамен «Биотехнологии и промышленная экология». Спокойно, это база — разберётесь.</p>
    </div>

    <div class="mt-2">${levelSwitch(level === 'base'
      ? 'База — то, что точно нужно, чтобы сдать. Прогресс уровней считается отдельно.'
      : 'Продвинутый — механизмы и детали для высокого балла. Прогресс уровней считается отдельно.')}</div>

    <div class="ring-block">
      <div class="ring-wrap">
        <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="var(--grad-a)"></stop>
              <stop offset="100%" stop-color="var(--grad-b)"></stop>
            </linearGradient>
          </defs>
          <circle class="track" cx="100" cy="100" r="${R}"></circle>
          <circle class="fill" id="ringFill" cx="100" cy="100" r="${R}" stroke="url(#ringGrad)"
                  stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"></circle>
        </svg>
        <div class="ring-center">
          <div class="ring-num">${avg === null ? '—' : pct + '%'}</div>
          <div class="ring-cap">${avg === null ? 'пока нет пройденных тестов' : 'средний результат по тестам'}</div>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><b>${readCount()} / ${theory().length}</b><span>разделов изучено</span></div>
        <div class="stat"><b>${taken}</b><span>тест${plural(taken,'','а','ов')} пройдено</span></div>
        <div class="stat"><b>${questions().length}</b><span>вопросов в базе</span></div>
      </div>
    </div>

    <div class="big-cards">
      <button class="big-card" data-go="learn">
        <span class="ic">${IC.book}</span>
        <span class="tx"><span class="tt">Учить материал</span><span class="st">${theory().length} разделов теории</span></span>
        <span class="arrow">${IC.chev}</span>
      </button>
      <button class="big-card" data-go="picker">
        <span class="ic">${IC.quiz}</span>
        <span class="tx"><span class="tt">Проверить себя</span><span class="st">Тесты с объяснениями</span></span>
        <span class="arrow">${IC.chev}</span>
      </button>
    </div>
    <p class="pdf-line">Нужен запасной вариант в дорогу?
      <a href="konspekt.pdf" download>Скачайте конспект PDF</a> — вся теория и все вопросы с ответами.</p>

    <h2 class="eyebrow">Разделы</h2>
    <div class="sec-list">${list}</div>
  </div>`;
}

/* =========================================================================
   Экран: Учить материал
   ========================================================================= */
function viewLearn(){
  const list = theory().map(s => {
    const done = !!P().read[s.id];
    const n = s.blocks.length;
    return `
      <button class="sec-item" data-go="section" data-id="${esc(s.id)}">
        <span class="tick ${done ? 'on' : ''}" aria-hidden="true">${IC.check}</span>
        <span class="sec-body">
          <span class="sec-name">${esc(s.title)}</span>
          <span class="sec-meta">
            <span>${done ? 'Прочитано' : 'Ещё не читали'}</span>
            <span>${n} блок${plural(n,'','а','ов')} материала</span>
          </span>
          ${s.recommendedFirst ? '<span class="badge">Рекомендуем начать отсюда</span>' : ''}
        </span>
      </button>`;
  }).join('');

  return `
  <div class="screen">
    <h1 class="h-page">Учить материал</h1>
    <p class="lead">${level === 'base'
      ? 'Пять разделов. Читайте по одному — торопиться некуда. Раздел 3 даёт понятия, на которых держатся остальные, поэтому начинать удобнее с него.'
      : 'Продвинутый уровень: механизмы, стадии и зависимости. Каждый разбирается по шагам — читайте не спеша.'}</p>
    <div class="mt-2">${levelSwitch()}</div>
    <div class="sec-list mt-2">${list}</div>
  </div>`;
}

/* =========================================================================
   Экран: Раздел теории
   ========================================================================= */
function renderBlock(b){
  if(b.t === 'p'){
    // Многие абзацы начинаются с заголовка капслоком («ВОДА.», «БЕЛКИ. (Химия пищи, гл. 1.)»).
    // Выделяем эту часть, остальное оставляем обычным текстом.
    const text = b.text;
    const low = text.search(/[а-яёa-z]/);
    let head = '', rest = text;
    if(low === -1){ head = text; rest = ''; }
    else {
      const sp = text.slice(0, low).lastIndexOf(' ');
      if(sp > 0){ head = text.slice(0, sp); rest = text.slice(sp + 1); }
    }
    const caps = (head.match(/[А-ЯЁA-Z]/g) || []).length;
    if(head && caps >= 2){
      return `<p class="b-p${rest ? '' : ' solo'}"><span class="cap">${esc(head)}</span>${rest ? ' ' + esc(rest) : ''}</p>`;
    }
    return `<p class="b-p plain">${esc(text)}</p>`;
  }
  if(b.t === 'term'){
    return `<dl class="b-term"><dt>${esc(b.term)}</dt><dd>${esc(b.def)}</dd></dl>`;
  }
  if(b.t === 'tip'){
    return `<div class="b-tip"><span class="tic">${IC.bulb}</span><span><span class="tt">Подсказка</span>${esc(b.text)}</span></div>`;
  }
  if(b.t === 'table'){
    const head = b.head.map(h => `<th scope="col">${esc(h)}</th>`).join('');
    const rows = b.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('');
    return `<div class="b-table"><div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }
  return '';
}

function viewSection(id){
  const s = sectionById(id);
  if(!s) return '<p>Раздел не найден.</p>';
  const n = questionsFor(id).length;
  const done = !!P().read[id];

  return `
  <div class="screen">
    <h1 class="h-sec">${esc(s.title)}</h1>
    ${s.recommendedFirst ? '<p class="lead">Рекомендуем начать отсюда — это ядро экзамена.</p>' : ''}
    <div class="theory">${s.blocks.map(renderBlock).join('')}</div>

    <div id="endMark" style="height:1px"></div>

    <div class="stack mt-3">
      <div class="read-note" id="readNote" ${done ? '' : 'hidden'}>${IC.check}<span>Раздел прочитан</span></div>
      <button class="btn btn-primary" data-test-sec="${esc(id)}">Пройти тест по этому разделу — ${Math.min(SEC_SIZE, n)} вопрос${plural(Math.min(SEC_SIZE, n),'','а','ов')}${n > SEC_SIZE ? ` из ${n}` : ''}</button>
      <button class="btn btn-ghost" data-go="learn">К списку разделов</button>
    </div>
  </div>`;
}

function watchEnd(id){
  const mark = document.getElementById('endMark');
  if(!mark) return;
  observer = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if(e.isIntersecting){
        if(markRead(id)){
          const note = document.getElementById('readNote');
          if(note) note.hidden = false;
        }
        if(observer){ observer.disconnect(); observer = null; }
      }
    });
  }, { rootMargin:'0px 0px -10% 0px' });
  observer.observe(mark);
}

/* =========================================================================
   Экран: Выбор теста
   ========================================================================= */
function viewPicker(){
  const list = theory().map(s => {
    const best = P().best[s.id];
    const n = questionsFor(s.id).length;
    return `
      <button class="sec-item" data-test-sec="${esc(s.id)}">
        <span class="tick ${typeof best === 'number' ? 'on' : ''}" aria-hidden="true">${IC.check}</span>
        <span class="sec-body">
          <span class="sec-name">${esc(s.title)}</span>
          <span class="sec-meta">
            <span>${Math.min(SEC_SIZE, n)} вопрос${plural(Math.min(SEC_SIZE, n),'','а','ов')}${n > SEC_SIZE ? ` из ${n}` : ''}</span>
            ${typeof best === 'number' ? `<span class="sec-score">Лучший результат: ${best}%</span>` : '<span>Ещё не проходили</span>'}
          </span>
        </span>
      </button>`;
  }).join('');

  const bestMix = P().best.mix;
  const total = questions().length;
  const mixN = Math.min(MIX_SIZE, total);

  return `
  <div class="screen">
    <h1 class="h-page">Проверить себя</h1>
    <p class="lead">Ошибиться на тренировке — нормально. После каждого ответа будет короткое объяснение.</p>
    <div class="mt-2">${levelSwitch()}</div>

    <div class="big-cards" style="grid-template-columns:1fr">
      <button class="big-card" data-test-mix="1">
        <span class="ic">${IC.shuffle}</span>
        <span class="tx">
          <span class="tt">Всё вперемешку</span>
          <span class="st">${mixN} случайных вопросов из всех разделов${typeof bestMix === 'number' ? ' · лучший результат: ' + bestMix + '%' : ''}</span>
        </span>
        <span class="arrow">${IC.chev}</span>
      </button>
    </div>

    <h2 class="eyebrow">Или по разделу</h2>
    <div class="sec-list">${list}</div>
  </div>`;
}

/* =========================================================================
   Тест
   ========================================================================= */
function prepare(q){
  const order = shuffle(q.opts.map((_, i) => i));
  return { src:q, opts:order.map(i => q.opts[i]), a:order.indexOf(q.a) };
}

function startTest(mode, sec){
  const pool = mode === 'mix'
    ? shuffle(questions()).slice(0, MIX_SIZE)
    : shuffle(questionsFor(sec)).slice(0, SEC_SIZE);
  test = { level, mode, sec, items:pool.map(prepare), idx:0, chosen:null, correct:0, wrong:[] };
  go({ name:'test' });
}

function startRedo(wrongSources){
  test = { level, mode:'redo', sec:test ? test.sec : null,
           items:shuffle(wrongSources).map(prepare), idx:0, chosen:null, correct:0, wrong:[] };
  go({ name:'test' });
}

function scopeLabel(t){
  if(t.mode === 'mix') return 'Всё вперемешку';
  if(t.mode === 'redo') return 'Работа над ошибками';
  const s = sectionById(t.sec);
  return s ? shortTitle(s.title) : '';
}

function viewTest(){
  const t = test;
  const item = t.items[t.idx];
  const total = t.items.length;
  const answered = t.chosen !== null;
  const isRight = answered && t.chosen === item.a;
  const barPct = ((t.idx + (answered ? 1 : 0)) / total) * 100;

  const opts = item.opts.map((text, i) => {
    let cls = 'opt', markHtml = String.fromCharCode(1040 + i); // А, Б, В, Г
    if(answered){
      if(i === item.a){ cls += ' correct'; markHtml = IC.check; }
      else if(i === t.chosen){ cls += ' wrong'; markHtml = IC.cross; }
      else { cls += ' dim'; }
    }
    return `
      <button class="${cls}" data-opt="${i}" ${answered ? 'disabled' : ''}>
        <span class="mark" aria-hidden="true">${markHtml}</span>
        <span>${esc(text)}</span>
      </button>`;
  }).join('');

  const expl = answered ? `
    <div class="expl" role="status">
      <span class="verdict ${isRight ? 'ok' : 'no'}">${isRight ? IC.check : IC.cross}${isRight ? 'Верно' : 'Неверно — правильный ответ подсвечен'}</span>
      ${esc(item.src.expl)}
    </div>` : '';

  const last = t.idx === total - 1;

  return `
  <div class="screen">
    <div class="qhead">
      <span class="qcount">Вопрос ${t.idx + 1} из ${total}</span>
      <span class="qscope">${esc(scopeLabel(t))}</span>
    </div>
    <div class="bar"><i style="width:${barPct}%"></i></div>
    <h1 class="qtext">${esc(item.src.q)}</h1>
    <div class="opts">${opts}</div>
    ${expl}
    <div class="qfoot">
      ${answered ? `<button class="btn btn-primary" data-next="1">${last ? 'Показать результат' : 'Дальше'}</button>` : ''}
    </div>
  </div>`;
}

function answer(i){
  if(test.chosen !== null) return;
  test.chosen = i;
  const item = test.items[test.idx];
  if(i === item.a) test.correct++;
  else test.wrong.push(item.src);
  render();
}

function next(){
  if(test.idx < test.items.length - 1){
    test.idx++;
    test.chosen = null;
    go({ name:'test' });
  } else {
    const total = test.items.length;
    test.pct = Math.round(test.correct / total * 100);
    if(test.mode === 'section') recordBest(test.sec, test.pct);
    else if(test.mode === 'mix') recordBest('mix', test.pct);
    go({ name:'result' });
  }
}

/* =========================================================================
   Экран: Результат
   ========================================================================= */
function praiseFor(pct){
  if(pct === 100) return 'Идеально. Вы это знаете.';
  if(pct >= 80)   return 'Очень хорошо. База уверенно на месте.';
  if(pct >= 60)   return 'Хороший результат. Осталось подтянуть пару тем.';
  if(pct >= 30)   return 'Порог в 30 баллов вы уже берёте. Пройдёмся по ошибкам — и станет крепче.';
  return 'Спокойно, это только тренировка. Перечитайте раздел и попробуйте ещё раз — так и учатся.';
}

function viewResult(){
  const t = test;
  const total = t.items.length;
  const saved = t.mode === 'section' || t.mode === 'mix';

  const bySec = {};
  t.wrong.forEach(q => { bySec[q.sec] = (bySec[q.sec] || 0) + 1; });
  const mistakes = theory()
    .filter(s => bySec[s.id])
    .map(s => `<li><span class="dot" aria-hidden="true"></span><span>${esc(s.title)}</span><span class="n">— ${bySec[s.id]} ошиб${plural(bySec[s.id],'ка','ки','ок')}</span></li>`)
    .join('');

  return `
  <div class="screen result">
    <div class="score">${t.pct}%</div>
    <div class="score-sub">Верных ответов: ${t.correct} из ${total}${saved ? '' : ' · результат не идёт в общий зачёт'}</div>
    <p class="praise">${esc(praiseFor(t.pct))}</p>

    ${t.wrong.length ? `
      <div class="mist"><h3>Где были ошибки</h3><ul>${mistakes}</ul></div>` : `
      <div class="mist"><h3>Ошибок нет</h3><p class="empty">Весь набор пройден без единой ошибки.</p></div>`}

    <div class="stack mt-3" style="text-align:left">
      ${t.wrong.length ? `<button class="btn btn-primary" data-redo="1">Работа над ошибками — ${t.wrong.length} вопрос${plural(t.wrong.length,'','а','ов')}</button>` : ''}
      <button class="btn ${t.wrong.length ? 'btn-ghost' : 'btn-primary'}" data-go="home">На главную</button>
    </div>
  </div>`;
}

/* =========================================================================
   Обработчики
   ========================================================================= */
function bind(){
  app.querySelectorAll('[data-go]').forEach(el => {
    el.addEventListener('click', () => {
      const to = el.dataset.go;
      go(to === 'section' ? { name:'section', id:el.dataset.id } : { name:to });
    });
  });
  app.querySelectorAll('[data-level]').forEach(el => {
    el.addEventListener('click', () => setLevel(el.dataset.level));
  });
  app.querySelectorAll('[data-test-sec]').forEach(el => {
    el.addEventListener('click', () => startTest('section', el.dataset.testSec));
  });
  const mix = app.querySelector('[data-test-mix]');
  if(mix) mix.addEventListener('click', () => startTest('mix', null));

  app.querySelectorAll('[data-opt]').forEach(el => {
    el.addEventListener('click', () => answer(Number(el.dataset.opt)));
  });
  const nx = app.querySelector('[data-next]');
  if(nx) nx.addEventListener('click', next);
  const redo = app.querySelector('[data-redo]');
  if(redo) redo.addEventListener('click', () => startRedo(test.wrong.slice()));

  if(view.name === 'section') watchEnd(view.id);

  if(view.name === 'home'){
    const fill = document.getElementById('ringFill');
    if(fill){
      const C = 2 * Math.PI * 84;
      const pct = averageScore() === null ? 0 : averageScore();
      requestAnimationFrame(() => requestAnimationFrame(() => {
        fill.style.strokeDashoffset = (C * (1 - pct / 100)).toFixed(2);
      }));
    }
  }
}

render();
</script>

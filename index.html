:root{
  color-scheme:light dark;

  --bg:#F4F5FB;
  --surface:#FFFFFF;
  --surface-2:#F5F6FC;
  --ink:#101019;
  --muted:#6B6C84;
  --line:#E6E7F2;

  --primary:#5B4CE6;
  --primary-soft:#EDEBFF;
  --btn-a:#6D5EFC;
  --btn-b:#5334D6;
  --on-primary:#FFFFFF;

  --grad-a:#7C6BFF;
  --grad-b:#22C7E8;

  --correct:#0E9F6E; --correct-bg:#E7FAF2; --correct-line:#A5E8CE;
  --wrong:#DD3A50;   --wrong-bg:#FDEDEF;   --wrong-line:#F6BDC5;

  --shadow-sm:0 1px 2px rgba(16,16,40,.06);
  --shadow:0 2px 6px rgba(16,16,40,.05), 0 14px 34px -12px rgba(16,16,40,.14);
  --glow:0 8px 24px -8px rgba(91,76,230,.55);

  --r:20px; --r-sm:14px;
  --wrap:760px;
  --ease:cubic-bezier(.22,.72,.28,1);
  --sans:'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}


@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0A12;
    --surface:#15161F;
    --surface-2:#1C1D29;
    --ink:#ECEDF7;
    --muted:#9A9CB4;
    --line:#272939;

    --primary:#A99BFF;
    --primary-soft:#1E1B36;
    --btn-a:#7C6BFF;
    --btn-b:#5B47E0;

    --grad-a:#9385FF;
    --grad-b:#2DD4E8;

    --correct:#3ED8A0; --correct-bg:#0E2A22; --correct-line:#1F5F49;
    --wrong:#FF8090;   --wrong-bg:#2B1219;   --wrong-line:#682834;

    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 2px 6px rgba(0,0,0,.4), 0 14px 34px -12px rgba(0,0,0,.6);
    --glow:0 8px 24px -8px rgba(124,107,255,.45);
  }
}
:root[data-theme="dark"]{
    --bg:#0A0A12;
    --surface:#15161F;
    --surface-2:#1C1D29;
    --ink:#ECEDF7;
    --muted:#9A9CB4;
    --line:#272939;

    --primary:#A99BFF;
    --primary-soft:#1E1B36;
    --btn-a:#7C6BFF;
    --btn-b:#5B47E0;

    --grad-a:#9385FF;
    --grad-b:#2DD4E8;

    --correct:#3ED8A0; --correct-bg:#0E2A22; --correct-line:#1F5F49;
    --wrong:#FF8090;   --wrong-bg:#2B1219;   --wrong-line:#682834;

    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow:0 2px 6px rgba(0,0,0,.4), 0 14px 34px -12px rgba(0,0,0,.6);
    --glow:0 8px 24px -8px rgba(124,107,255,.45);
  }

/* Базовый кегль на <html> — переключатель А / А+ / А++ меняет его, всё остальное в rem */
html{ font-size:18px; -webkit-text-size-adjust:100%; }
html[data-fs="2"]{ font-size:21px; }
html[data-fs="3"]{ font-size:24px; }

*,*::before,*::after{ box-sizing:border-box; }

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(900px 460px at 50% -180px, var(--primary-soft), transparent 72%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--sans);
  font-size:1rem;
  font-weight:400;
  line-height:1.62;
  letter-spacing:-.005em;
  overflow-wrap:break-word;
  -webkit-font-smoothing:antialiased;
}

h1,h2,h3{ margin:0; font-weight:700; line-height:1.22; letter-spacing:-.02em; }
p{ margin:0; }
ul{ margin:0; padding:0; list-style:none; }
button{ font:inherit; color:inherit; background:none; border:none; margin:0; padding:0; cursor:pointer; }
:focus{ outline:none; }
:focus-visible{ outline:3px solid var(--primary); outline-offset:3px; border-radius:8px; }

.wrap{ width:100%; max-width:var(--wrap); margin:0 auto; padding:0 1.1rem; }

/* ---------------- Шапка ---------------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:color-mix(in srgb, var(--bg) 78%, transparent);
  backdrop-filter:saturate(160%) blur(14px);
  -webkit-backdrop-filter:saturate(160%) blur(14px);
  border-bottom:1px solid var(--line);
}
@supports not (background: color-mix(in srgb, red 50%, blue)){
  .topbar{ background:var(--bg); }
}
.topbar-in{
  display:flex; align-items:center; flex-wrap:wrap; gap:.4rem .6rem;
  min-height:58px; padding-top:.45rem; padding-bottom:.45rem;
}
.back{
  display:inline-flex; align-items:center; gap:.3rem;
  flex:none; white-space:nowrap;
  min-height:44px; padding:.3rem .7rem .3rem .45rem; margin-left:-.45rem;
  border-radius:12px; color:var(--primary); font-weight:600; font-size:.92rem;
  transition:background-color .18s var(--ease);
}
.back[hidden]{ display:none; }
.back:hover{ background:var(--primary-soft); }
.back svg{ width:1.15em; height:1.15em; flex:none; }

.lvl-chip{
  flex:none; display:inline-flex; align-items:center; gap:.4rem;
  padding:.3rem .7rem; border-radius:999px;
  background:var(--primary-soft); color:var(--primary);
  font-size:.76rem; font-weight:700; letter-spacing:.02em;
  white-space:nowrap;
}
.lvl-chip .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; }

.fs-switch{ display:flex; align-items:center; gap:.2rem; flex:none; margin-left:auto; }
.fs-btn{
  min-width:44px; min-height:44px; padding:0 .3rem;
  display:inline-flex; align-items:center; justify-content:center;
  border:1px solid var(--line); background:var(--surface);
  border-radius:12px; color:var(--muted); font-weight:700;
  transition:all .18s var(--ease);
}
.fs-btn[data-size="1"]{ font-size:.78rem; }
.fs-btn[data-size="2"]{ font-size:.94rem; }
.fs-btn[data-size="3"]{ font-size:1.1rem; }
.fs-btn:hover{ color:var(--ink); }
.fs-btn[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--btn-a),var(--btn-b));
  border-color:transparent; color:var(--on-primary); box-shadow:var(--glow);
}

/* ---------------- Общее ---------------- */
main{ padding:1.6rem 0 4.5rem; }
.screen{ animation:in .3s var(--ease) both; }
@keyframes in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

.lead{ color:var(--muted); margin-top:.55rem; }
.h-page{ font-size:1.72rem; }
.h-sec{ font-size:1.34rem; }
.stack{ display:flex; flex-direction:column; gap:.8rem; }
.mt-1{ margin-top:.8rem; } .mt-2{ margin-top:1.4rem; } .mt-3{ margin-top:2.2rem; }

.eyebrow{
  font-size:.72rem; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin:2.2rem 0 .85rem;
}

.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
  width:100%; min-height:56px; padding:.9rem 1.3rem;
  border-radius:var(--r-sm); font-weight:600; text-align:center;
  border:1px solid transparent;
  transition:transform .14s var(--ease), box-shadow .2s var(--ease), background-color .2s var(--ease);
}
.btn:active{ transform:scale(.985); }
.btn-primary{
  background:linear-gradient(140deg,var(--btn-a),var(--btn-b));
  color:var(--on-primary); box-shadow:var(--glow);
}
.btn-primary:hover{ box-shadow:0 12px 30px -8px rgba(91,76,230,.62); }
.btn-ghost{ background:var(--surface); color:var(--primary); border-color:var(--line); box-shadow:var(--shadow-sm); }
.btn-ghost:hover{ background:var(--surface-2); }

/* ---------------- Сегмент-контрол ---------------- */
.seg{
  display:grid; grid-auto-flow:column; grid-auto-columns:1fr; gap:.25rem;
  padding:.3rem; border-radius:999px;
  background:var(--surface-2); border:1px solid var(--line);
}
.seg button{
  min-height:46px; padding:.4rem .6rem; border-radius:999px;
  font-weight:600; font-size:.95rem; color:var(--muted);
  display:flex; align-items:center; justify-content:center; gap:.4rem;
  transition:color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
}
.seg button:hover{ color:var(--ink); }
.seg button[aria-pressed="true"]{
  background:linear-gradient(140deg,var(--btn-a),var(--btn-b));
  color:var(--on-primary); box-shadow:var(--glow);
}
.seg-hint{ color:var(--muted); font-size:.84rem; margin-top:.6rem; text-align:center; }

/* ---------------- Главная ---------------- */
.hero{ text-align:center; }
.hero h1{ font-size:1.95rem; }
.hero .lead{ max-width:36ch; margin-left:auto; margin-right:auto; }

.ring-block{ margin-top:1.9rem; display:flex; flex-direction:column; align-items:center; }
.ring-wrap{ position:relative; width:min(210px, 62vw); aspect-ratio:1; }
.ring{ width:100%; height:100%; display:block; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-linecap:round; }
.ring .track{ stroke:var(--line); stroke-width:12; }
.ring .fill{ stroke-width:12; transition:stroke-dashoffset 1.15s var(--ease); }
.ring-center{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; text-align:center; padding:0 1.4rem;
}
.ring-num{
  font-size:2.9rem; font-weight:700; line-height:1; letter-spacing:-.04em;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.ring-cap{ font-size:.74rem; color:var(--muted); margin-top:.5rem; line-height:1.35; }

.stats{ display:flex; gap:.7rem; margin-top:1.4rem; width:100%; }
.stat{
  flex:1; text-align:center; padding:.85rem .6rem;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); box-shadow:var(--shadow-sm);
}
.stat b{ display:block; font-size:1.25rem; letter-spacing:-.02em; }
.stat span{ display:block; font-size:.74rem; color:var(--muted); margin-top:.15rem; line-height:1.3; }

.big-cards{ display:grid; gap:.8rem; margin-top:1.7rem; }
.pdf-line{ margin-top:.9rem; font-size:.85rem; color:var(--muted); text-align:center; line-height:1.5; }
.pdf-line a{ color:var(--primary); font-weight:600; }
.big-card{
  display:flex; align-items:center; gap:1rem;
  width:100%; min-width:0; text-align:left; min-height:56px;
  padding:1.2rem 1.3rem;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow);
  transition:transform .16s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
}
.big-card:hover{ transform:translateY(-2px); border-color:color-mix(in srgb, var(--primary) 30%, var(--line)); }
.big-card:active{ transform:translateY(0); }
.big-card .ic{
  flex:none; width:54px; height:54px; border-radius:16px;
  display:flex; align-items:center; justify-content:center;
  background:var(--primary-soft); color:var(--primary);
}
.big-card .ic svg{ width:26px; height:26px; }
.big-card .tx{ min-width:0; flex:1 1 auto; }
.big-card .tt{ display:block; font-size:1.16rem; font-weight:700; letter-spacing:-.02em; }
.big-card .st{ display:block; color:var(--muted); font-size:.85rem; margin-top:.2rem; }
.big-card .arrow{ flex:none; color:var(--muted); display:flex; }

/* ---------------- Список разделов ---------------- */
.sec-list{ display:flex; flex-direction:column; gap:.65rem; }
.sec-item{
  display:flex; align-items:flex-start; gap:.9rem;
  width:100%; min-width:0; text-align:left; min-height:56px;
  padding:1.05rem 1.15rem;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); box-shadow:var(--shadow-sm);
  transition:transform .16s var(--ease), border-color .2s var(--ease), box-shadow .2s var(--ease);
}
.sec-item:hover{
  transform:translateY(-1px); box-shadow:var(--shadow);
  border-color:color-mix(in srgb, var(--primary) 26%, var(--line));
}
.tick{
  flex:none; width:28px; height:28px; margin-top:.1rem; border-radius:50%;
  border:2px solid var(--line); display:flex; align-items:center; justify-content:center;
  transition:all .2s var(--ease);
}
.tick svg{ width:15px; height:15px; opacity:0; }
.tick.on{ background:var(--correct); border-color:var(--correct); }
.tick.on svg{ opacity:1; color:#fff; }
.sec-body{ min-width:0; flex:1; }
.sec-name{ display:block; font-weight:600; letter-spacing:-.01em; }
.sec-meta{ display:flex; flex-wrap:wrap; gap:.1rem .7rem; color:var(--muted); font-size:.82rem; margin-top:.3rem; }
.sec-score{ color:var(--primary); font-weight:600; }
.badge{
  display:inline-block; margin-top:.5rem;
  font-size:.72rem; font-weight:700; letter-spacing:.02em;
  color:var(--on-primary); background:linear-gradient(140deg,var(--btn-a),var(--btn-b));
  padding:.22rem .65rem; border-radius:999px;
}

/* ---------------- Теория ---------------- */
.theory{ display:flex; flex-direction:column; gap:.8rem; margin-top:1.5rem; }
.b-p{ margin-top:1.4rem; }
.b-p.plain{ margin-top:.3rem; }
.b-p .cap{
  font-weight:700; font-size:.86em; letter-spacing:.09em;
  color:var(--primary);
}
.b-p.solo .cap{ display:block; }
.theory > .b-p:first-child{ margin-top:0; }

.b-term{
  position:relative; overflow:hidden;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:1.05rem 1.15rem;
  box-shadow:var(--shadow-sm);
}
.b-term::before{
  content:''; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:linear-gradient(180deg,var(--grad-a),var(--grad-b));
}
.b-term dt{ font-weight:700; font-size:1.04rem; letter-spacing:-.015em; }
.b-term dd{ margin:.35rem 0 0; color:var(--ink); }

.b-tip{
  display:flex; gap:.85rem; align-items:flex-start;
  background:var(--primary-soft); border:1px solid transparent;
  border-radius:var(--r-sm); padding:1rem 1.15rem;
}
.b-tip .tic{ flex:none; color:var(--primary); margin-top:.1rem; }
.b-tip .tic svg{ width:20px; height:20px; display:block; }
.b-tip .tt{ display:block; font-size:.72rem; font-weight:700; letter-spacing:.11em; text-transform:uppercase; color:var(--primary); margin-bottom:.2rem; }

.b-table{
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); overflow:hidden; box-shadow:var(--shadow-sm);
}
.b-table .scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
table{ border-collapse:collapse; width:100%; min-width:21rem; }
th,td{ text-align:left; padding:.72rem .95rem; vertical-align:top; font-size:.93rem; border-bottom:1px solid var(--line); }
th{ background:var(--surface-2); font-weight:700; white-space:nowrap; font-size:.8rem; letter-spacing:.03em; text-transform:uppercase; color:var(--muted); }
tr:last-child td{ border-bottom:none; }

.read-note{
  display:flex; align-items:center; gap:.6rem;
  color:var(--correct); font-weight:600; font-size:.92rem;
  background:var(--correct-bg); border:1px solid var(--correct-line);
  border-radius:var(--r-sm); padding:.85rem 1.1rem;
}
.read-note svg{ width:1.15em; height:1.15em; flex:none; }

/* ---------------- Тест ---------------- */
.qhead{ display:flex; align-items:center; justify-content:space-between; gap:1rem; }
.qcount{ font-size:.86rem; font-weight:700; letter-spacing:.02em; }
.qscope{ color:var(--muted); font-size:.82rem; text-align:right; min-width:0; }
.bar{ height:8px; border-radius:999px; background:var(--line); overflow:hidden; margin-top:.7rem; }
.bar > i{
  display:block; height:100%; width:0; border-radius:999px;
  background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
  transition:width .45s var(--ease);
}
.qtext{ font-size:1.36rem; font-weight:700; line-height:1.3; letter-spacing:-.025em; margin-top:1.7rem; }

.opts{ display:flex; flex-direction:column; gap:.6rem; margin-top:1.4rem; }
.opt{
  display:flex; align-items:center; gap:.85rem;
  width:100%; min-width:0; text-align:left; min-height:56px;
  padding:.85rem 1.05rem;
  background:var(--surface); border:2px solid var(--line);
  border-radius:var(--r-sm);
  transition:background-color .2s var(--ease), border-color .2s var(--ease), transform .22s var(--ease);
}
.opt:hover:not(:disabled){ border-color:color-mix(in srgb, var(--primary) 45%, var(--line)); background:var(--surface-2); }
.opt:disabled{ cursor:default; }
.opt .mark{
  flex:none; width:32px; height:32px; border-radius:10px;
  border:1.5px solid var(--line); background:var(--surface-2);
  display:flex; align-items:center; justify-content:center;
  font-size:.85rem; font-weight:700; color:var(--muted);
}
.opt .mark svg{ width:16px; height:16px; }
.opt.correct{ background:var(--correct-bg); border-color:var(--correct); transform:translateX(5px); }
.opt.correct .mark{ background:var(--correct); border-color:var(--correct); color:#fff; }
.opt.wrong{ background:var(--wrong-bg); border-color:var(--wrong); transform:translateX(5px); }
.opt.wrong .mark{ background:var(--wrong); border-color:var(--wrong); color:#fff; }
.opt.dim{ opacity:.5; }

.expl{
  margin-top:1.1rem; padding:1.05rem 1.15rem;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); box-shadow:var(--shadow-sm);
  animation:rise .32s var(--ease) both;
}
@keyframes rise{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:none;} }
.expl .verdict{ display:flex; align-items:flex-start; gap:.45rem; font-weight:700; margin-bottom:.35rem; }
.expl .verdict svg{ width:18px; height:18px; flex:none; margin-top:.28em; }
.expl .verdict.ok{ color:var(--correct); }
.expl .verdict.no{ color:var(--wrong); }
.qfoot{ margin-top:1.3rem; }

/* ---------------- Результат ---------------- */
.result{ text-align:center; padding-top:1rem; }
.score{
  font-size:4.4rem; font-weight:700; line-height:1; letter-spacing:-.05em;
  background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
.score-sub{ color:var(--muted); margin-top:.6rem; font-size:.92rem; }
.praise{ font-size:1.14rem; font-weight:600; margin-top:1.3rem; letter-spacing:-.015em; }
.mist{
  text-align:left; margin-top:1.9rem; padding:1.15rem 1.25rem;
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); box-shadow:var(--shadow-sm);
}
.mist h3{ font-size:1rem; }
.mist ul{ margin-top:.7rem; display:flex; flex-direction:column; gap:.55rem; }
.mist li{ display:flex; flex-wrap:wrap; gap:.15rem .6rem; align-items:baseline; }
.mist .dot{ flex:none; width:7px; height:7px; border-radius:50%; background:var(--wrong); transform:translateY(-2px); }
.mist .n{ color:var(--muted); font-size:.85rem; white-space:nowrap; }
.empty{ color:var(--muted); font-size:.92rem; margin-top:.5rem; }

@media (min-width:600px){
  .big-cards{ grid-template-columns:1fr 1fr; }
  .hero h1{ font-size:2.3rem; }
}
@media (max-width:479px){
  .lvl-chip{ display:none; }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
    scroll-behavior:auto !important;
  }
  .opt.correct,.opt.wrong,.big-card:hover,.sec-item:hover{ transform:none; }
}
</style>

<script>
/* =========================================================================
   Хранилище: localStorage в try/catch с откатом в память
   ========================================================================= */
document.documentElement.lang = 'ru';

// Офлайн-режим. Работает только по http(s) — при открытии файла с диска
// приложение и так автономно. Ошибку регистрации молча игнорируем.
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  });
}

const store = (() => {
  let mem = {};
  return {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k]=v; } }
  };
})();

/* =========================================================================
   КОНТЕНТ — базовый уровень
   ========================================================================= */
const THEORY = [
  {
    id: 's3', title: 'Раздел 3. Химический состав и пищевая ценность', recommendedFirst: true,
    blocks: [
      {t:'tip', text:'Это ядро экзамена. Если начинаете с нуля — начните с этого раздела: на этих понятиях держатся остальные.'},

      {t:'term', term:'Пищевая ценность', def:'Общий показатель: объединяет энергетическую, биологическую, физиологическую, органолептическую ценность и усвояемость.'},
      {t:'term', term:'Энергетическая ценность (калорийность)', def:'Сколько энергии даёт продукт. Считают по коэффициентам: белки ×4, жиры ×9, углеводы ×4, спирт ×7 ккал на грамм.'},
      {t:'tip', text:'Пример: 100 г = 10 г белка + 5 г жира + 60 г углеводов → 10×4 + 5×9 + 60×4 = 325 ккал.'},
      {t:'term', term:'Биологическая ценность', def:'Насколько белок подходит организму по аминокислотам. Оценивают аминокислотным скором; самая «нехватающая» (лимитирующая) аминокислота ограничивает пользу всего белка.'},
      {t:'term', term:'Физиологическая ценность', def:'Влияние на организм: кофеин бодрит, пищевые волокна помогают пищеварению, полифенолы — антиоксиданты.'},
      {t:'term', term:'Усвояемость', def:'Сколько реально усваивается. У животных белков обычно выше, чем у растительных.'},

      {t:'p', text:'ВОДА.'},
      {t:'term', term:'Свободная вода', def:'В капиллярах продукта; замерзает при 0 °C, служит средой для реакций, доступна микроорганизмам.'},
      {t:'term', term:'Связанная вода', def:'Крепко удержана в продукте; не замерзает при обычных температурах, микроорганизмам недоступна, трудно удаляется сушкой.'},
      {t:'term', term:'Активность воды (aw)', def:'Показатель «доступной» воды, от 0 до 1. Чем ниже, тем хуже растут микробы — на этом основано консервирование сушкой, солью, сахаром. (Химия пищи, гл. 10 «Минеральные вещества и вода пищи».)'},
      {t:'table', head:['Условие','aw'], rows:[
        ['Свежие продукты','0,98–0,99'],
        ['Бактерии не растут','ниже 0,90'],
        ['Плесени не растут','ниже 0,80'],
        ['Сухие продукты','ниже 0,60']
      ]},

      {t:'p', text:'БЕЛКИ. (Химия пищи, гл. 1.)'},
      {t:'term', term:'Структура белка', def:'Четыре уровня: первичная — последовательность аминокислот; вторичная — α-спираль, которую удерживают водородные связи между CO- и NH-группами пептидной цепи (с. 45–46); третичная — пространственная укладка; четвертичная — объединение субъединиц.'},
      {t:'term', term:'Денатурация', def:'Нарушение вторичной, третичной и четвертичной структуры при сохранении первичной. У многих белков тепловая денатурация начинается уже при ~40 °C и быстро нарастает (с. 75). Сильные химические агенты (мочевина, гуанидинхлорид) разрушают гидратную оболочку и структуру (с. 76). Итог — потеря биологической активности (с. 74–77). Бытовой пример — яйцо при жарке.'},
      {t:'term', term:'Изоэлектрическая точка', def:'Белок амфотерен; его суммарный заряд зависит от pH. В изоэлектрической точке заряд равен нулю, и растворимость белка минимальна (с. 81–82).'},
      {t:'term', term:'Функционально-технологические свойства', def:'Растворимость, гелеобразование, эмульгирование, пенообразование, влагоудерживающая способность — на них строится технология новых белковых продуктов (с. 269–270). Синерезис — когда гель отдаёт жидкость (сыворотка на поверхности йогурта).'},
      {t:'term', term:'Новые формы белковой пищи', def:'Изолят (белка более 90%), концентрат (65–90%), текстурат (структурирован экструзией — соевое «мясо»), гидролизат (расщеплён ферментами, легко усваивается).'},
      {t:'term', term:'Незаменимые аминокислоты', def:'Валин, лейцин, изолейцин, лизин, метионин, треонин, триптофан, фенилаланин (детям ещё гистидин и аргинин). Организм их не синтезирует — должны поступать с пищей.'},

      {t:'p', text:'ФЕРМЕНТЫ. (Химия пищи, гл. 5 «Ферменты».)'},
      {t:'term', term:'Ферменты', def:'Биологические катализаторы белковой природы: снижают энергию активации реакции, высокоспецифичны, не расходуются. Работают лучше всего при 30–50 °C; от сильного нагрева денатурируют и гибнут; у каждого свой оптимум pH.'},
      {t:'table', head:['Фермент','Что расщепляет / где применяют'], rows:[
        ['Амилаза','крахмал → сахара (осахаривание солода в пиве и спирте)'],
        ['Протеаза','белки → пептиды и аминокислоты (сыроделие)'],
        ['Липаза','жиры → жирные кислоты и глицерин (при неконтроле — прогоркание)'],
        ['Пектиназа','пектин (осветление соков и вина)'],
        ['Полифенолоксидаза','окисляет фенолы (потемнение среза яблока; тормозится нагревом и кислотой)']
      ]},

      {t:'p', text:'УГЛЕВОДЫ. (Химия пищи, гл. 8 «Углеводы».)'},
      {t:'term', term:'Моносахариды', def:'Глюкоза (энергия клетки), фруктоза (самый сладкий), галактоза.'},
      {t:'term', term:'Дисахариды', def:'Сахароза = глюкоза + фруктоза; лактоза = глюкоза + галактоза; мальтоза = глюкоза + глюкоза (продукт распада крахмала).'},
      {t:'term', term:'Крахмал', def:'Состоит из двух фракций: амилоза (линейная, склонна к ретроградации) и амилопектин (разветвлённая).'},
      {t:'term', term:'Клейстеризация', def:'При нагреве в воде (55–80 °C) крахмальные зёрна набухают и разрушаются, резко растёт вязкость (кисель, соус).'},
      {t:'term', term:'Ретроградация', def:'При остывании молекулы крахмала снова упорядочиваются и отдают воду — это физическая причина чёрствения хлеба.'},
      {t:'term', term:'Клетчатка (целлюлоза)', def:'Тоже полимер глюкозы, но с β-1,4-связями (у крахмала α-1,4). Человек её не переваривает — нет фермента целлюлазы.'},
      {t:'term', term:'Пектиновые вещества', def:'Полимеры галактуроновой кислоты; с сахаром и кислотой дают гель (джем, мармелад). При созревании плодов нерастворимый протопектин переходит в растворимый пектин, и плод мягчает.'},

      {t:'p', text:'ЛИПИДЫ (ЖИРЫ). (Химия пищи, гл. 7 «Пищевые липиды», с. 435–457.)'},
      {t:'term', term:'Триглицериды', def:'Основные жиры — эфиры глицерина и трёх жирных кислот. Также есть фосфолипиды (лецитин — эмульгатор) и стерины.'},
      {t:'term', term:'Насыщенные жирные кислоты', def:'Без двойных связей, обычно твёрдые (сало, сливочное масло).'},
      {t:'term', term:'Ненасыщенные жирные кислоты', def:'С двойными связями, жидкие, легко окисляются. Омега-3 и Омега-6 незаменимы.'},
      {t:'term', term:'Гидролитическое прогоркание', def:'Расщепление жира на жирные кислоты и глицерин под действием влаги и липаз.'},
      {t:'term', term:'Окислительное прогоркание', def:'Окисление по двойным связям кислородом: сначала пероксиды, затем альдегиды и кетоны (запах прогорклого). Тормозят антиоксиданты (токоферол, витамин E), холод, темнота, упаковка без воздуха.'},

      {t:'p', text:'ВИТАМИНЫ И МИНЕРАЛЫ. (Химия пищи, гл. 9 «Витамины», гл. 10 «Минеральные вещества».)'},
      {t:'term', term:'Витамины', def:'Водо- и жирорастворимые. Разрушаются от нагрева, света, кислорода, щелочной среды (особенно витамин C). Сохранение: меньше варить, готовить на пару, быстрая заморозка, тёмная герметичная тара, подкисление.'},
      {t:'term', term:'Макроэлементы', def:'Кальций (кости, свёртывание крови), фосфор (энергообмен, АТФ), магний, натрий и калий (водно-солевой баланс), сера, хлор.'},
      {t:'term', term:'Микроэлементы', def:'Железо (гемоглобин; дефицит → анемия), йод (гормоны щитовидной железы; дефицит → зоб), цинк, медь, селен, фтор.'},

  {sec:'s1', q:'Масличные семена содержат жира до:', opts:['10–15%','20–25%','40–50%','70–80%'], a:2, expl:'Подсолнечник, соя, рапс — до 40–50% жира.'},
  {sec:'s1', q:'Основной запас крахмала и клейковины в зерне — это:', opts:['оболочки','зародыш','эндосперм','алейроновый слой'], a:2, expl:'Эндосперм — 80–85% зерна, идёт в муку и на спирт.'},
  {sec:'s1', q:'Часть зерна, богатая жиром и легко прогоркающая:', opts:['эндосперм','зародыш','плодовые оболочки','алейроновый слой'], a:1, expl:'Зародыш богат жиром, поэтому из муки длительного хранения его убирают.'},
  {sec:'s1', q:'Основу отрубей составляют:', opts:['эндосперм','зародыш','оболочки и алейроновый слой','крахмальные зёрна'], a:2, expl:'Отруби — это оболочки и алейроновый слой: клетчатка и минералы.'},
  {sec:'s1', q:'Для спиртового и пивоваренного производства предпочтительно зерно:', opts:['с высокой клейковиной','с высоким крахмалом и низким белком','с высоким жиром','с высокой зольностью'], a:1, expl:'Спирту нужен крахмал (сырьё для сахаров), а не клейковина.'},
  {sec:'s1', q:'Метод Кьельдаля определяет:', opts:['жир','белок (по общему азоту)','влажность','сахар'], a:1, expl:'Кьельдаль меряет азот, затем × 6,25 = белок.'},
  {sec:'s1', q:'Метод Сокслета определяет:', opts:['белок','жир','кислотность','сахар'], a:1, expl:'Сокслет — экстракция жира растворителем.'},
  {sec:'s1', q:'Рефрактометрия определяет:', opts:['белок','жир','содержание сахара / сухих веществ','микробов'], a:2, expl:'По преломлению света быстро оценивают сахар и сухие вещества.'},
  {sec:'s1', q:'Кислотность сырья определяют:', opts:['экстракцией','титрованием щёлочью','рефрактометрией','сушкой'], a:1, expl:'Титруют щёлочью до нейтрализации с фенолфталеином.'},

  // ---- Раздел 2 ----
  {sec:'s2', q:'Замораживание останавливает порчу, потому что:', opts:['повышает кислотность','связывает воду в лёд и делает её недоступной микробам','убивает все споры','удаляет кислород'], a:1, expl:'Микробам нужна свободная вода; во льду её нет.'},
  {sec:'s2', q:'Регулируемая газовая среда (РГС) продлевает хранение за счёт:', opts:['повышения кислорода','снижения кислорода и замедления дыхания сырья','полного удаления влаги','стерилизации'], a:1, expl:'Меньше O₂ → сырьё дышит медленнее → дольше хранится.'},
  {sec:'s2', q:'Сублимационная сушка (лиофилизация) — это:', opts:['нагрев до кипения','заморозка и удаление воды возгонкой льда','выпаривание под давлением','копчение'], a:1, expl:'Лёд испаряется, минуя жидкую фазу; продукт сохраняет структуру.'},
  {sec:'s2', q:'Самосогревание зерна при хранении вызвано:', opts:['низкой температурой','дыханием и микрофлорой при повышенной влажности','избытком кислорода','повреждением зёрен'], a:1, expl:'Дыхание выделяет тепло; во влажном зерне процесс лавинообразный.'},
  {sec:'s2', q:'Автолиз сырья — это:', opts:['развитие плесени','саморазрушение тканей собственными ферментами','окисление жиров','потеря влаги'], a:1, expl:'Ткань разрушается своими же ферментами (созревание мяса).'},
  {sec:'s2', q:'Дыхание живого сырья при хранении сопровождается выделением:', opts:['только кислорода','CO₂, воды и тепла','этанола','аммиака'], a:1, expl:'C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O + тепло.'},

  // ---- Раздел 4 ----
  {sec:'s4', q:'Пастеризация — это нагрев:', opts:['выше 100 °C, убивающий споры','до 60–95 °C, убивающий вегетативные формы','до 40 °C','с заморозкой'], a:1, expl:'Пастеризация мягче стерилизации: споры она не убивает.'},
  {sec:'s4', q:'Стерилизация в отличие от пастеризации:', opts:['идёт при более низкой температуре','не убивает микробы','нагрев выше 100 °C, убивает и споры','только для молока'], a:2, expl:'Выше 100 °C гибнут и споровые формы — отсюда долгое хранение консервов.'},
  {sec:'s4', q:'Реакция Майяра протекает между:', opts:['двумя молекулами сахара','сахаром и аминогруппой белка при нагреве','жиром и кислородом','спиртом и кислотой'], a:1, expl:'Нужны сахар и аминогруппа — тогда появляется корочка и аромат.'},
  {sec:'s4', q:'Главное отличие Майяра от карамелизации:', opts:['Майяр идёт при более высокой температуре','Майяру обязательно нужна аминогруппа','карамелизация требует белка','Майяр идёт без нагрева'], a:1, expl:'Карамелизация — только сахара; Майяру нужен ещё и белок.'},
  {sec:'s4', q:'Спиртовое брожение осуществляют:', opts:['уксуснокислые бактерии','молочнокислые бактерии','дрожжи','плесени'], a:2, expl:'Дрожжи Saccharomyces превращают сахар в спирт и CO₂.'},
  {sec:'s4', q:'Уравнение спиртового брожения:', opts:['C₆H₁₂O₆ → 2C₂H₅OH + 2CO₂','C₆H₁₂O₆ + 6O₂ → 6CO₂ + 6H₂O','C₆H₁₂O₆ → 2C₃H₆O₃','2C₂H₅OH + O₂ → 2CH₃COOH'], a:0, expl:'Сахар → спирт + углекислый газ, без кислорода.'},
  {sec:'s4', q:'Уксуснокислое брожение:', opts:['анаэробное','аэробное (требует кислорода)','не требует микробов','идёт только при 0 °C'], a:1, expl:'Уксусным бактериям нужен воздух — этим оно отличается от спиртового.'},
  {sec:'s4', q:'Разрыхление теста газом происходит из-за:', opts:['молочнокислого брожения','уксуснокислого брожения','спиртового брожения дрожжей','гидролиза крахмала'], a:2, expl:'Дрожжи выделяют CO₂, который поднимает тесто.'},
  {sec:'s4', q:'Инверсия сахара — это гидролиз сахарозы до:', opts:['мальтозы и глюкозы','глюкозы и фруктозы','крахмала','молочной кислоты'], a:1, expl:'Под действием кислоты или инвертазы; инвертный сахар не засахаривается.'},

  // ---- Раздел 5 ----
  {sec:'s5', q:'Продукт глубокой переработки сырья:', opts:['мука','крупа','белковый изолят / глюкозный сироп','цельное зерно'], a:2, expl:'Мука и крупа — неглубокая переработка; изолят и сироп — глубокая.'},
  {sec:'s5', q:'Соложение зерна включает:', opts:['сушка → замачивание → проращивание','замачивание → проращивание → сушка солода','дробление → варка → брожение','проращивание → замачивание → обжарка'], a:1, expl:'Сначала замачивают, потом проращивают, затем сушат — получают солод.'},
  {sec:'s5', q:'Тартратная стабилизация вина — это:', opts:['добавление сахара','обработка холодом для снятия винного камня','фильтрация через уголь','пастеризация'], a:1, expl:'На холоде выпадает винный камень (тартраты), вино становится стабильным.'},
  {sec:'s5', q:'Содержание спирта в напитке определяют:', opts:['методом Кьельдаля','ареометрией / дистилляцией','методом Сокслета','титрованием'], a:1, expl:'По плотности (ареометр) или отгонкой спирта (дистилляция).'},
  {sec:'s5', q:'Биотехнология — это:', opts:['любая тепловая обработка','использование живых организмов и ферментов для получения продуктов','механическая переработка зерна','розлив и упаковка'], a:1, expl:'Ключевое — работа живых организмов/ферментов (дрожжи, закваски).'},

  // ================= ДОБАВЛЕНО: покрытие теории, которая раньше не проверялась =================

  // ---- Раздел 3 ----
  {sec:'s3', q:'Пищевая ценность продукта объединяет:', opts:['только калорийность','энергетическую, биологическую, физиологическую, органолептическую ценность и усвояемость','только содержание белка','только вкус и запах'], a:1, expl:'Это общий показатель, который собирает в себе все перечисленные составляющие.'},
  {sec:'s3', q:'Коэффициент энергетической ценности 1 г белка:', opts:['9 ккал','4 ккал','7 ккал','2 ккал'], a:1, expl:'Белки и углеводы дают по 4 ккал/г, жиры — 9, спирт — 7.'},
  {sec:'s3', q:'Коэффициент энергетической ценности 1 г углеводов:', opts:['4 ккал','7 ккал','9 ккал','5 ккал'], a:0, expl:'Углеводы, как и белки, дают 4 ккал/г.'},
  {sec:'s3', q:'100 г продукта: 20 г белка, 10 г жира, 50 г углеводов. Энергетическая ценность:', opts:['330 ккал','370 ккал','280 ккал','420 ккал'], a:1, expl:'20×4 + 10×9 + 50×4 = 80 + 90 + 200 = 370 ккал.'},
  {sec:'s3', q:'Физиологическая ценность продукта — это:', opts:['его калорийность','влияние на организм: кофеин бодрит, волокна помогают пищеварению, полифенолы — антиоксиданты','аминокислотный состав белка','доля усвоенного вещества'], a:1, expl:'Речь именно о физиологическом действии компонентов на организм.'},
  {sec:'s3', q:'Усвояемость белков обычно выше у:', opts:['растительных белков','животных белков','одинакова у всех','зависит только от способа варки'], a:1, expl:'У животных белков усвояемость обычно выше, чем у растительных.'},
  {sec:'s3', q:'Связанная вода в продукте:', opts:['замерзает при 0 °C','не замерзает при обычных температурах и недоступна микроорганизмам','легко удаляется сушкой','служит средой для реакций'], a:1, expl:'Она крепко удержана продуктом, поэтому и сушкой удаляется трудно.'},
  {sec:'s3', q:'Активность воды свежих продуктов составляет:', opts:['0,40–0,50','0,60–0,70','0,80–0,85','0,98–0,99'], a:3, expl:'У свежих продуктов aw почти предельная — 0,98–0,99.'},
  {sec:'s3', q:'Сухие продукты характеризуются активностью воды:', opts:['выше 0,95','около 0,90','ниже 0,60','равной 1,0'], a:2, expl:'Сухие продукты — это aw ниже 0,60.'},
  {sec:'s3', q:'Консервирование сушкой, солью и сахаром основано на:', opts:['повышении активности воды','снижении активности воды','повышении pH','денатурации белков'], a:1, expl:'Чем ниже активность воды, тем хуже растут микробы.'},
  {sec:'s3', q:'Первичная структура белка — это:', opts:['α-спираль','последовательность аминокислот','пространственная укладка цепи','объединение субъединиц'], a:1, expl:'Первый уровень — просто порядок аминокислот в цепи.'},
  {sec:'s3', q:'Третичная структура белка — это:', opts:['последовательность аминокислот','α-спираль','пространственная укладка','объединение субъединиц'], a:2, expl:'Третичная — то, как цепь уложена в пространстве.'},
  {sec:'s3', q:'Четвертичная структура белка — это:', opts:['последовательность аминокислот','объединение субъединиц','α-спираль','укладка одной цепи'], a:1, expl:'Четвертичный уровень появляется, когда несколько субъединиц объединяются.'},
  {sec:'s3', q:'У многих белков тепловая денатурация начинается уже при температуре около:', opts:['20 °C','40 °C','70 °C','100 °C'], a:1, expl:'Начало примерно при ~40 °C, дальше процесс быстро нарастает.'},
  {sec:'s3', q:'Мочевина и гуанидинхлорид вызывают денатурацию, потому что:', opts:['повышают температуру','разрушают гидратную оболочку и структуру белка','снижают pH','связывают воду в лёд'], a:1, expl:'Это сильные химические агенты денатурации.'},
  {sec:'s3', q:'Итог денатурации белка:', opts:['рост биологической активности','потеря биологической активности','разрыв первичной структуры','повышение растворимости'], a:1, expl:'Структура нарушена — биологическая активность теряется.'},
  {sec:'s3', q:'К функционально-технологическим свойствам белков относят:', opts:['калорийность и усвояемость','растворимость, гелеобразование, эмульгирование, пенообразование, влагоудерживающую способность','кислотное и перекисное число','только растворимость'], a:1, expl:'На этих свойствах строится технология новых белковых продуктов.'},
  {sec:'s3', q:'Концентрат белка содержит белка:', opts:['менее 20%','30–40%','65–90%','более 95%'], a:2, expl:'Концентрат — 65–90%; изолят очищен сильнее, свыше 90%.'},
  {sec:'s3', q:'Соевое «мясо» получают в виде:', opts:['изолята','концентрата','текстурата','гидролизата'], a:2, expl:'Текстурат структурируют экструзией — это и есть соевое «мясо».'},
  {sec:'s3', q:'Белковый гидролизат — это форма белковой пищи, которая:', opts:['содержит более 90% белка','расщеплена ферментами и легко усваивается','структурирована экструзией','получена высушиванием'], a:1, expl:'Ферменты уже расщепили белок, поэтому он усваивается легко.'},
  {sec:'s3', q:'Незаменимые аминокислоты называются так, потому что:', opts:['их больше всего в белке','организм их не синтезирует и они должны поступать с пищей','они самые калорийные','они не разрушаются при нагреве'], a:1, expl:'Синтезировать их организм не умеет — только получить с едой.'},
  {sec:'s3', q:'Дополнительно незаменимыми для детей считают:', opts:['аланин и глицин','гистидин и аргинин','серин и пролин','глутамин и аспарагин'], a:1, expl:'К восьми незаменимым у детей добавляются гистидин и аргинин.'},
  {sec:'s3', q:'Ферменты по химической природе — это:', opts:['углеводы','белки','липиды','минеральные соли'], a:1, expl:'Ферменты — биологические катализаторы белковой природы.'},
  {sec:'s3', q:'От сильного нагрева ферменты:', opts:['работают быстрее всего','денатурируют и гибнут','переходят в спящее состояние','не изменяются'], a:1, expl:'Фермент — белок, поэтому сильный нагрев его денатурирует.'},
  {sec:'s3', q:'Липаза расщепляет:', opts:['крахмал','белки','жиры на жирные кислоты и глицерин','пектин'], a:2, expl:'Если процесс не контролировать, это ведёт к прогорканию.'},
  {sec:'s3', q:'Потемнение среза яблока вызывает фермент:', opts:['амилаза','липаза','полифенолоксидаза','пектиназа'], a:2, expl:'Полифенолоксидаза окисляет фенолы, и срез темнеет.'},
  {sec:'s3', q:'Действие полифенолоксидазы тормозится:', opts:['охлаждением до 0 °C','нагревом и кислотой','щелочной средой','ярким светом'], a:1, expl:'Поэтому яблоки сбрызгивают кислым соком или бланшируют.'},
  {sec:'s3', q:'Осахаривание солода в пиве и спирте ведёт фермент:', opts:['протеаза','амилаза','липаза','пектиназа'], a:1, expl:'Амилаза превращает крахмал в сахара.'},
  {sec:'s3', q:'В сыроделии применяют фермент:', opts:['амилазу','протеазу','пектиназу','полифенолоксидазу'], a:1, expl:'Протеаза расщепляет белки до пептидов и аминокислот.'},
  {sec:'s3', q:'Самый сладкий из моносахаридов:', opts:['глюкоза','фруктоза','галактоза','мальтоза'], a:1, expl:'Фруктоза — самый сладкий моносахарид.'},
  {sec:'s3', q:'Мальтоза состоит из:', opts:['глюкозы и фруктозы','двух молекул глюкозы','глюкозы и галактозы','двух молекул фруктозы'], a:1, expl:'Мальтоза = глюкоза + глюкоза, это продукт распада крахмала.'},
  {sec:'s3', q:'Мальтоза образуется как продукт распада:', opts:['белка','жира','крахмала','клетчатки'], a:2, expl:'Крахмал распадается до мальтозы.'},
  {sec:'s3', q:'Фракция крахмала, склонная к ретроградации:', opts:['амилопектин','амилоза','целлюлоза','пектин'], a:1, expl:'Амилоза линейная и потому легко упорядочивается заново.'},
  {sec:'s3', q:'Разветвлённая фракция крахмала:', opts:['амилоза','амилопектин','целлюлоза','мальтоза'], a:1, expl:'Амилопектин — разветвлённая фракция, амилоза — линейная.'},
  {sec:'s3', q:'Клейстеризация крахмала происходит при нагреве в воде до:', opts:['20–30 °C','55–80 °C','100–120 °C','0–10 °C'], a:1, expl:'В этом интервале зёрна набухают и разрушаются.'},
  {sec:'s3', q:'При клейстеризации крахмальные зёрна:', opts:['отдают воду','набухают и разрушаются, вязкость резко растёт','кристаллизуются','расщепляются до глюкозы'], a:1, expl:'Поэтому кисель и соус густеют.'},
  {sec:'s3', q:'Связи в целлюлозе, в отличие от крахмала:', opts:['α-1,4','β-1,4','α-1,6','пептидные'], a:1, expl:'У крахмала α-1,4, у целлюлозы β-1,4 — их человек не разрывает.'},
  {sec:'s3', q:'Пектиновые вещества — это полимеры:', opts:['глюкозы','галактуроновой кислоты','аминокислот','глицерина'], a:1, expl:'Именно галактуроновой кислоты.'},
  {sec:'s3', q:'Джем и мармелад застывают, потому что пектин образует гель:', opts:['с солью','с сахаром и кислотой','со щёлочью','с жиром'], a:1, expl:'Нужны одновременно сахар и кислота.'},
  {sec:'s3', q:'Триглицериды — это:', opts:['эфиры глицерина и трёх жирных кислот','полимеры глюкозы','белки запаса','соли жирных кислот'], a:0, expl:'Это основная форма пищевых жиров.'},
  {sec:'s3', q:'Лецитин относится к фосфолипидам и работает как:', opts:['антиоксидант','эмульгатор','краситель','консервант'], a:1, expl:'Лецитин — эмульгатор.'},
  {sec:'s3', q:'Ненасыщенные жирные кислоты:', opts:['не имеют двойных связей','жидкие и легко окисляются','всегда твёрдые','не встречаются в пище'], a:1, expl:'Двойные связи делают их жидкими и уязвимыми к окислению.'},
  {sec:'s3', q:'Гидролитическое прогоркание — это:', opts:['окисление по двойным связям','расщепление жира на жирные кислоты и глицерин под действием влаги и липаз','полимеризация жира','карамелизация'], a:1, expl:'Здесь работает вода и липаза, а не кислород.'},
  {sec:'s3', q:'При окислительном прогоркании сначала образуются:', opts:['альдегиды','пероксиды','кетоны','глицерин'], a:1, expl:'Сначала пероксиды, затем уже альдегиды и кетоны.'},
  {sec:'s3', q:'Окислительное прогоркание тормозят:', opts:['тепло и свет','антиоксиданты, холод, темнота, упаковка без воздуха','кислород','повышенная влажность'], a:1, expl:'Всё, что убирает кислород, свет и тепло.'},
  {sec:'s3', q:'Витамины делят на:', opts:['кислые и щелочные','водо- и жирорастворимые','животные и растительные','простые и сложные'], a:1, expl:'Это основное деление витаминов.'},
  {sec:'s3', q:'Для сохранения витаминов при готовке рекомендуют:', opts:['дольше варить в открытой посуде','меньше варить, готовить на пару, быстро замораживать','хранить на свету','добавлять щёлочь'], a:1, expl:'Ещё помогают тёмная герметичная тара и подкисление.'},
  {sec:'s3', q:'За прочность костей и свёртывание крови отвечает:', opts:['железо','кальций','йод','цинк'], a:1, expl:'Кальций — макроэлемент костей и свёртывания крови.'},
  {sec:'s3', q:'В энергообмене и составе АТФ участвует:', opts:['кальций','фосфор','хлор','селен'], a:1, expl:'Фосфор — энергообмен и АТФ.'},
  {sec:'s3', q:'Водно-солевой баланс поддерживают:', opts:['железо и йод','натрий и калий','кальций и фосфор','цинк и медь'], a:1, expl:'Натрий и калий отвечают за водно-солевой баланс.'},
  {sec:'s3', q:'К микроэлементам относят:', opts:['кальций и фосфор','железо, йод, цинк, медь, селен, фтор','натрий и калий','серу и хлор'], a:1, expl:'Кальций, фосфор, магний, натрий, калий, сера, хлор — это макроэлементы.'},
  {sec:'s3', q:'Базовых вкусов выделяют:', opts:['три','четыре','пять','семь'], a:2, expl:'Сладкий, кислый, солёный, горький и умами.'},
  {sec:'s3', q:'Кислый вкус обусловлен:', opts:['ионами H⁺','ионами Na⁺','алкалоидами','глутаматом'], a:0, expl:'Кислый вкус дают ионы водорода.'},
  {sec:'s3', q:'Солёный вкус дают:', opts:['ионы H⁺','ионы Na⁺ и Cl⁻','сахара','алкалоиды'], a:1, expl:'Натрий и хлор — это солёный вкус.'},
  {sec:'s3', q:'Горький вкус обусловлен:', opts:['сахарами','алкалоидами и дубильными веществами','ионами натрия','глутаматом'], a:1, expl:'Горечь дают алкалоиды и дубильные вещества.'},
  {sec:'s3', q:'Винная кислота характерна для:', opts:['яблок','винограда и вина','молока','уксуса'], a:1, expl:'Винная кислота — кислота винограда и вина.'},
  {sec:'s3', q:'Большинство бактерий не переносит pH ниже:', opts:['6,5','5,5','4,5','3,0'], a:2, expl:'Порог около 4,5 — на этом и держится консервирующее действие кислот.'},

  // ---- Раздел 1 ----
  {sec:'s1', q:'Качество готового продукта определяется прежде всего:', opts:['упаковкой','составом и качеством сырья','сроком хранения','формой нарезки'], a:1, expl:'Сырьё — исходный материал, его состав задаёт качество продукта.'},
  {sec:'s1', q:'К сахароносному растительному сырью относятся:', opts:['пшеница и ячмень','свёкла и тростник','соя и рапс','картофель и кукуруза'], a:1, expl:'Сахароносные культуры — свёкла и тростник.'},
  {sec:'s1', q:'К масличным семенам относят:', opts:['пшеницу, рожь, рис','подсолнечник, сою, рапс','свёклу и тростник','ячмень и кукурузу'], a:1, expl:'Это основные масличные культуры.'},
  {sec:'s1', q:'К животному сырью относятся:', opts:['мясо, молоко, яйца, рыба','зерновые и плоды','вода и соль','дрожжи и закваски'], a:0, expl:'Это и есть перечень животного сырья.'},
  {sec:'s1', q:'К минеральному сырью относят:', opts:['мясо и молоко','питьевую и технологическую воду, поваренную соль','дрожжи и закваски','зерно и плоды'], a:1, expl:'Вода и соль — минеральное сырьё.'},
  {sec:'s1', q:'Дрожжи и закваски относятся к сырью:', opts:['растительному','животному','минеральному','микробиологическому'], a:3, expl:'Микробиологическое сырьё нужно для брожения.'},
  {sec:'s1', q:'Эндосперм составляет от массы зерна:', opts:['2–3%','13–15%','80–85%','40–50%'], a:2, expl:'Это основная часть зерна.'},
  {sec:'s1', q:'Зародыш составляет от массы зерна:', opts:['2–3%','13–15%','30%','80%'], a:0, expl:'Зародыш мал по массе, но богат жиром.'},
  {sec:'s1', q:'Оболочки и алейроновый слой составляют от массы зерна:', opts:['2–3%','13–15%','50%','80–85%'], a:1, expl:'Это отруби — 13–15% зерна.'},
  {sec:'s1', q:'Зародыш зерна богат жиром и витаминами:', opts:['C и D','B и E','A и K','только C'], a:1, expl:'Из-за жира зародыш легко прогоркает.'},
  {sec:'s1', q:'Отруби богаты:', opts:['крахмалом','клетчаткой и минералами','клейковиной','жиром'], a:1, expl:'Отруби — это оболочки и алейроновый слой.'},
  {sec:'s1', q:'Зерно с высоким содержанием клейковины предпочтительно для:', opts:['производства спирта','хлебопечения','получения масла','производства сахара'], a:1, expl:'Много клейковины — хлеб; много крахмала и мало белка — спирт и пиво.'},
  {sec:'s1', q:'При созревании плодов содержание сахаров:', opts:['снижается','растёт','не меняется','падает до нуля'], a:1, expl:'Сахаров становится больше, а кислоты меньше.'},
  {sec:'s1', q:'При созревании плодов содержание кислоты:', opts:['растёт','снижается','не меняется','удваивается'], a:1, expl:'Поэтому спелый плод менее кислый.'},
  {sec:'s1', q:'Качество масличных семян оценивают по:', opts:['влажности и цвету','масличности и кислотному числу масла','числу падения','натуре'], a:1, expl:'Кислотное число показывает порчу масла.'},
  {sec:'s1', q:'Вид, цвет, запах, вкус и консистенцию оценивают методом:', opts:['титрования','органолептическим','рефрактометрии','Кьельдаля'], a:1, expl:'Это органолептическая оценка общего качества.'},
  {sec:'s1', q:'Влажность сырья определяют:', opts:['титрованием','высушиванием навески до постоянной массы','рефрактометрией','экстракцией'], a:1, expl:'Навеску сушат, пока масса не перестанет меняться.'},
  {sec:'s1', q:'При определении кислотности титрованием используют индикатор:', opts:['метиловый оранжевый','фенолфталеин','крахмал','йод'], a:1, expl:'Титруют щёлочью с фенолфталеином.'},
  {sec:'s1', q:'В методе Кьельдаля общий азот пересчитывают в белок с коэффициентом:', opts:['4,0','6,25','9,0','1,5'], a:1, expl:'Общий азот × 6,25 = белок.'},

  // ---- Раздел 2 ----
  {sec:'s2', q:'Охлаждение при хранении ведут в диапазоне:', opts:['−18 °C и ниже','0…+10 °C','+20…+25 °C','около +40 °C'], a:1, expl:'Это режим охлаждения, а не замораживания.'},
  {sec:'s2', q:'Охлаждение сырья:', opts:['полностью останавливает порчу','замедляет процессы, но не останавливает их','убивает все микробы','удаляет воду'], a:1, expl:'Ферментативные и микробиологические процессы только замедляются.'},
  {sec:'s2', q:'Замораживание ведут при температуре:', opts:['0 °C','−5 °C','−18 °C и ниже','+4 °C'], a:2, expl:'Именно при −18 °C и ниже порча почти останавливается.'},
  {sec:'s2', q:'В регулируемой газовой среде кислород снижают до:', opts:['2–5%','10–12%','21%','0%'], a:0, expl:'Одновременно повышают содержание CO₂.'},
  {sec:'s2', q:'В регулируемой газовой среде содержание CO₂:', opts:['снижают','повышают','не меняют','доводят до нуля'], a:1, expl:'Меньше кислорода и больше CO₂ — сырьё дышит медленнее.'},
  {sec:'s2', q:'К видам сушки относятся:', opts:['только конвективная','конвективная, вакуумная, сублимационная','только сублимационная','солевая и сахарная'], a:1, expl:'Это три названных способа сушки.'},
  {sec:'s2', q:'Сушка защищает продукт от порчи, потому что:', opts:['повышает активность воды','удаляет воду и снижает активность воды','повышает pH','убивает споры'], a:1, expl:'Микробам нужна доступная вода, а сушка её убирает.'},
  {sec:'s2', q:'К химическим консервантам относят:', opts:['сульфиты, сорбиновую и бензойную кислоты','только соль и сахар','только уксус','углекислый газ'], a:0, expl:'Это перечень средств химического консервирования.'},
  {sec:'s2', q:'В виноделии как химический консервант применяют:', opts:['сорбиновую кислоту','сульфиты','поваренную соль','бензойную кислоту'], a:1, expl:'Сульфиты — консервант виноделия.'},
  {sec:'s2', q:'Микробиологическая порча — это развитие:', opts:['собственных ферментов ткани','плесеней, бактерий и дрожжей при тепле и повышенной влажности','насекомых-вредителей','окисления жира'], a:1, expl:'Саморазрушение своими ферментами — это автолиз, а не микробиологическая порча.'},
  {sec:'s2', q:'Интенсивность дыхания сырья при хранении растёт с:', opts:['понижением температуры','повышением температуры и влажности','уменьшением влажности','понижением давления'], a:1, expl:'Отсюда и самосогревание влажного зерна.'},
  {sec:'s2', q:'Для хранения зерна применяют:', opts:['моечные машины','элеваторы и силосы','сепараторы','холодильные камеры'], a:1, expl:'Элеваторы и силосы — зерновые хранилища.'},
  {sec:'s2', q:'Сепараторы при подготовке сырья служат для:', opts:['охлаждения','очистки','сушки','упаковки'], a:1, expl:'Сепаратор очищает сырьё от примесей.'},

  // ---- Раздел 4 ----
  {sec:'s4', q:'Заваривание солода горячей водой и отжим сока — это примеры:', opts:['гидролиза','экстракции','брожения','пастеризации'], a:1, expl:'Экстракция — извлечение растворимых веществ.'},
  {sec:'s4', q:'Экстракция — это:', opts:['расщепление вещества водой','извлечение растворимых веществ','нагрев выше 100 °C','сбраживание сахара'], a:1, expl:'Сюда же относится извлечение масла растворителем.'},
  {sec:'s4', q:'Гидролиз — это расщепление вещества:', opts:['нагревом без воды','водой при участии кислот, щелочей или ферментов','кислородом','микроорганизмами'], a:1, expl:'Ключевое слово — расщепление водой.'},
  {sec:'s4', q:'При гидролизе белки расщепляются до:', opts:['сахаров','аминокислот','жирных кислот','спирта'], a:1, expl:'Крахмал → сахара, белки → аминокислоты, жиры → жирные кислоты и глицерин.'},
  {sec:'s4', q:'При гидролизе жиры расщепляются до:', opts:['сахаров','аминокислот','жирных кислот и глицерина','спирта и CO₂'], a:2, expl:'Это те же продукты, что и при гидролитическом прогоркании.'},
  {sec:'s4', q:'Пастеризацию применяют для:', opts:['консервов','молока, соков, пива','сухарей','замороженного мяса'], a:1, expl:'Это продукты, которые нельзя греть выше 100 °C.'},
  {sec:'s4', q:'Стерилизацию применяют для:', opts:['свежих соков','консервов','пива','охлаждённого молока'], a:1, expl:'Именно стерилизация даёт консервам длительное хранение.'},
  {sec:'s4', q:'Молочнокислое брожение осуществляют:', opts:['дрожжи','молочнокислые бактерии','уксусные бактерии','плесени'], a:1, expl:'Продукт — молочная кислота.'},
  {sec:'s4', q:'Продукт молочнокислого брожения:', opts:['этанол','молочная кислота','уксус','углекислый газ'], a:1, expl:'Молочнокислые бактерии дают молочную кислоту.'},
  {sec:'s4', q:'Спиртовое брожение протекает:', opts:['только на воздухе','без доступа кислорода (анаэробно)','только при 100 °C','только в щелочной среде'], a:1, expl:'В отличие от уксуснокислого, которому воздух нужен.'},
  {sec:'s4', q:'Уксус получают с помощью:', opts:['дрожжей','молочнокислых бактерий','уксусных бактерий','плесеней'], a:2, expl:'Уксусным бактериям для работы нужен воздух.'},
  {sec:'s4', q:'Спиртовое брожение ведут дрожжи рода:', opts:['Lactobacillus','Saccharomyces','Aspergillus','Acetobacter'], a:1, expl:'Дрожжи Saccharomyces превращают сахар в спирт и CO₂.'},
  {sec:'s4', q:'Инвертный сахар по сравнению с сахарозой:', opts:['менее сладкий','слаще и не засахаривается','не растворяется','горький'], a:1, expl:'Поэтому его используют, чтобы изделия не засахаривались.'},
  {sec:'s4', q:'Инверсию сахарозы вызывают:', opts:['щёлочь','кислота или фермент инвертаза','нагрев без воды','кислород'], a:1, expl:'Сахароза распадается на глюкозу и фруктозу.'},
  {sec:'s4', q:'Румяная корочка хлеба и аромат кофе и солода — результат:', opts:['карамелизации','реакции Майяра','гидролиза','брожения'], a:1, expl:'Сахар реагирует с аминогруппой белка при нагреве.'},
  {sec:'s4', q:'Карамелизация — это потемнение и аромат за счёт:', opts:['нагрева сахаров без участия белка','реакции сахара с белком','окисления жиров','действия дрожжей'], a:0, expl:'В отличие от Майяра, белок здесь не нужен.'},

  // ---- Раздел 5 ----
  {sec:'s5', q:'Технология пищевых производств — это:', opts:['наука о питании','набор методов и режимов переработки сырья в готовый продукт заданного качества','способ хранения продуктов','система контроля качества'], a:1, expl:'Речь именно о методах и режимах переработки.'},
  {sec:'s5', q:'К бродильной отрасли относят производство:', opts:['муки и крупы','пива, спирта, вина, дрожжей','растительного масла','колбасных изделий'], a:1, expl:'Это профильная для направления отрасль.'},
  {sec:'s5', q:'По виду сырья отрасли делят на:', opts:['сухие и влажные','зерноперерабатывающую, плодоовощную, масложировую, бродильную, молочную, мясную','горячие и холодные','крупные и мелкие'], a:1, expl:'Это классификация по перерабатываемому сырью.'},
  {sec:'s5', q:'Мука и крупа — это продукты:', opts:['глубокой переработки','неглубокой переработки','брожения','консервирования'], a:1, expl:'Глубокая переработка — это крахмал, сиропы, изоляты.'},
  {sec:'s5', q:'К продуктам глубокой переработки относят:', opts:['муку и крупу','крахмал, сиропы, изоляты','свежие овощи','цельное зерно'], a:1, expl:'Здесь сырьё разбирают на отдельные компоненты.'},
  {sec:'s5', q:'Технологическая линия начинается с этапа:', opts:['переработки','приёмки','розлива','хранения готового продукта'], a:1, expl:'Приёмка → хранение → подготовка → переработка → розлив → хранение готового.'},
  {sec:'s5', q:'Подготовка сырья в технологической линии включает:', opts:['розлив и упаковку','очистку и измельчение','выдержку','стерилизацию'], a:1, expl:'Это этап между хранением и переработкой.'},
  {sec:'s5', q:'На этапе получения сусла:', opts:['зерно проращивают','осахаривают крахмал ферментами или отжимают сок','разливают напиток','снимают винный камень'], a:1, expl:'Сусло — это сахаросодержащая среда для брожения.'},
  {sec:'s5', q:'Этап выдержки в бродильном производстве — это:', opts:['осахаривание','созревание напитка','розлив','замачивание зерна'], a:1, expl:'На выдержке напиток созревает.'},
  {sec:'s5', q:'Стабилизация в бродильном производстве включает:', opts:['замачивание зерна','осветление и обработку холодом','главное брожение','дробление солода'], a:1, expl:'Обработка холодом нужна для снятия винного камня.'},
  {sec:'s5', q:'Завершающий этап бродильного производства:', opts:['соложение','брожение','розлив и укупоривание','осахаривание'], a:2, expl:'После стабилизации напиток разливают и укупоривают.'},

  {sec:'s3', q:'Ферменты, катализирующие окислительно-восстановительные реакции, — это класс:', opts:['гидролазы','трансферазы','оксидоредуктазы','лиазы'], a:2, expl:'Полифенолоксидаза, каталаза — оксидоредуктазы. Амилаза/протеаза — гидролазы.'},
  {sec:'s3', q:'Стадия развития цепи при окислительном прогоркании:', opts:['R• + R• → R–R','ROO• + RH → ROOH + R•','образование первого радикала','распад гидроперекиси'], a:1, expl:'Пероксирадикал отрывает водород, порождая новый радикал — цепь продолжается.'},
  {sec:'s3', q:'Перекисное число жира характеризует:', opts:['свободные жирные кислоты','первичные продукты окисления (гидроперекиси)','ненасыщенность','молекулярную массу кислот'], a:1, expl:'Кислотное число — про гидролиз, перекисное — про раннюю стадию окисления.'},
  {sec:'s3', q:'Реакция Майяра максимальна при активности воды:', opts:['около 0,1','промежуточной ~0,6–0,7','около 1,0','не зависит от aw'], a:1, expl:'При средней aw подвижность реагентов есть, но раствор не слишком разбавлен.'},

  // Раздел 1
  {sec:'s1', q:'Низкое число падения зерна означает:', opts:['высокую активность α-амилазы (проросшее зерно)','низкую влажность','высокое содержание белка','высокую натуру'], a:0, expl:'Проросшее зерно богато амилазой — крахмал уже разрушается.'},
  {sec:'s1', q:'Прибор ИДК используют для оценки:', opts:['влажности','качества (упругости) клейковины','масличности','кислотности'], a:1, expl:'ИДК — измеритель деформации клейковины.'},
  {sec:'s1', q:'Кислотное число масла показывает:', opts:['степень окислительной порчи','содержание свободных жирных кислот (гидролитическую порчу)','ненасыщенность','цвет масла'], a:1, expl:'Свободные ЖК накапливаются при гидролизе жира.'},
  {sec:'s1', q:'Перекисное число масла показывает:', opts:['гидролитическую порчу','степень окислительной порчи (гидроперекиси)','плотность','вязкость'], a:1, expl:'Гидроперекиси — первичные продукты окисления.'},
  {sec:'s1', q:'Госсипол — это антипитательное вещество:', opts:['сои','подсолнечника','хлопчатника','рапса'], a:2, expl:'Госсипол содержится в хлопковом сырье.'},
  {sec:'s1', q:'Натура зерна — это:', opts:['доля белка','масса зерна в единице объёма','влажность','число падения'], a:1, expl:'Косвенно отражает выполненность и качество зерна.'},
  {sec:'s1', q:'Стекловидность зерна связана прежде всего с:', opts:['влажностью','структурой эндосперма и содержанием белка','размером зародыша','толщиной оболочек'], a:1, expl:'Стекловидное зерно плотнее и, как правило, богаче белком.'},

  // Раздел 2
  {sec:'s2', q:'Дыхательный коэффициент — это отношение:', opts:['O₂ к CO₂','выделенного CO₂ к поглощённому O₂','воды к теплу','сахара к спирту'], a:1, expl:'По нему судят о типе дыхания и субстрате окисления.'},
  {sec:'s2', q:'Критическая влажность зерна — это влажность, выше которой:', opts:['зерно высыхает','появляется свободная вода и резко растёт дыхание/самосогревание','прекращается дыхание','зерно прорастает мгновенно'], a:1, expl:'Свободная вода запускает бурное дыхание и микрофлору.'},
  {sec:'s2', q:'Климактерический подъём у плодов запускается гормоном:', opts:['ауксином','этиленом','инсулином','гиббереллином'], a:1, expl:'Этилен — «гормон созревания», вызывает всплеск дыхания.'},
  {sec:'s2', q:'Быстрое замораживание лучше медленного, потому что:', opts:['экономит энергию','образуются мелкие кристаллы льда, меньше повреждающие ткань','убивает все микробы','повышает влажность'], a:1, expl:'Крупные кристаллы при медленной заморозке рвут клеточные стенки.'},
  {sec:'s2', q:'Равновесная влажность продукта — это влажность, при которой:', opts:['продукт максимально сухой','обмен влагой с воздухом прекращается','начинается порча','замерзает вода'], a:1, expl:'aw продукта уравновешена с влажностью окружающего воздуха.'},
  {sec:'s2', q:'Послеуборочное дозревание зерна сопровождается:', opts:['ростом активности ферментов','снижением активности ферментов и ростом всхожести','увеличением влажности','прорастанием'], a:1, expl:'Зерно «дозревает»: улучшаются технологические свойства.'},

  // Раздел 4
  {sec:'s4', q:'Гликолиз (путь Эмбдена–Мейергофа–Парнаса) превращает глюкозу в:', opts:['этанол напрямую','2 молекулы пирувата','молочную кислоту напрямую','CO₂ и воду'], a:1, expl:'Пируват — общая развилка; дальше путь зависит от типа брожения.'},
  {sec:'s4', q:'При спиртовом брожении пируват превращается в этанол через промежуточный:', opts:['лактат','ацетальдегид','ацетил-КоА','глицерин'], a:1, expl:'Пируват → ацетальдегид (−CO₂) → этанол.'},
  {sec:'s4', q:'Энергетический выход спиртового брожения на 1 молекулу глюкозы:', opts:['0 АТФ','2 АТФ','18 АТФ','38 АТФ'], a:1, expl:'Брожение малоэффективно: всего 2 АТФ (против ~38 при полном окислении).'},
  {sec:'s4', q:'Перегруппировка Амадори относится к стадии реакции Майяра:', opts:['начальной','конечной','это карамелизация','это гидролиз'], a:0, expl:'Амадори — начальная стадия, до образования меланоидинов.'},
  {sec:'s4', q:'Гетероферментативное молочнокислое брожение в отличие от гомоферментативного даёт:', opts:['только молочную кислоту','кроме молочной кислоты — CO₂, этанол или уксусную кислоту','только этанол','только уксус'], a:1, expl:'«Гетеро» = несколько продуктов помимо молочной кислоты.'},
  {sec:'s4', q:'В периоде падающей скорости сушки удаляется преимущественно:', opts:['свободная влага с поверхности','связанная влага из глубины материала','кристаллизационная вода','только пар'], a:1, expl:'Скорость лимитируется диффузией влаги изнутри наружу.'},
  {sec:'s4', q:'Отличие реакции Майяра от карамелизации:', opts:['Майяр не требует нагрева','Майяру обязательно нужна аминогруппа','карамелизация требует белка','это одно и то же'], a:1, expl:'Карамелизация — только сахара; Майяру нужен ещё и аминокомпонент.'},

  // Раздел 5
  {sec:'s5', q:'Температурная пауза осахаривания при затирании — около:', opts:['37 °C','50 °C','63 °C','72 °C'], a:3, expl:'При ~72 °C активна α-амилаза, идёт полное осахаривание крахмала.'},
  {sec:'s5', q:'Белковая пауза при затирании (~50 °C) нужна для:', opts:['осахаривания крахмала','расщепления белков протеазами (аминный азот, стойкость и пена)','стерилизации сусла','экстракции хмеля'], a:1, expl:'Протеазы дают продукты, важные для пены и брожения.'},
  {sec:'s5', q:'Готовность затора по осахариванию проверяют:', opts:['по плотности','пробой на йод (нет синего окрашивания)','по цвету','по запаху'], a:1, expl:'Синий цвет с йодом означает, что крахмал ещё не осахарен.'},
  {sec:'s5', q:'При кипячении пивного сусла с хмелем происходит:', opts:['спиртовое брожение','изомеризация α-кислот хмеля и коагуляция белков','осахаривание','ретроградация'], a:1, expl:'Изомеризация даёт горечь; белки сворачиваются и осаждаются.'},
  {sec:'s5', q:'Красное виноделие отличается от белого тем, что брожение ведут:', opts:['без кожицы','на мезге (с кожицей) для экстракции антоцианов','при 0 °C','без дрожжей'], a:1, expl:'Контакт с кожицей даёт цвет (антоцианы) и танины.'},
  {sec:'s5', q:'ЧКД в виноделии — это:', opts:['чан для купажа','чистая культура дрожжей','число кислотности','centrifuge'], a:1, expl:'Чистые культуры дрожжей ведут контролируемое брожение.'},
  {sec:'s5', q:'Тартратная стабилизация вина основана на:', opts:['нагреве','выпадении винного камня при охлаждении','добавлении спирта','фильтрации через уголь'], a:1, expl:'На холоде тартраты кристаллизуются и удаляются.'},
  {sec:'s5', q:'Сушка солода с томлением формирует цвет и аромат за счёт:', opts:['карамелизации только','меланоидинов (реакция Майяра)','брожения','окисления жиров'], a:1, expl:'Тёмный солод — результат Майяра при отсушке.'},
  {sec:'s5', q:'Низовое и верховое брожение пива различаются:', opts:['видом сырья','видом дрожжей и температурой (верховое теплее)','давлением','цветом'], a:1, expl:'Низовое — при ~8–12 °C, верховое — при ~18–24 °C, разные штаммы дрожжей.'},

  // ================= ДОБАВЛЕНО: покрытие теории, которая раньше не проверялась =================

  // ---- Раздел 3 ----
  {sec:'s3', q:'На один виток α-спирали приходится примерно:', opts:['2 остатка','3,6 остатка','6 остатков','10 остатков'], a:1, expl:'~3,6 аминокислотных остатка на виток.'},
  {sec:'s3', q:'К разновидностям спиральных структур белка относят:', opts:['только правую α-спираль','правую α-спираль, 3₁₀-спираль и π-спираль','только β-слой','только клубок'], a:1, expl:'Это три названные разновидности спиралей.'},
  {sec:'s3', q:'β-Складчатый слой образован:', opts:['спирально закрученной цепью','вытянутыми цепями, связанными водородными связями «вбок»','дисульфидными мостиками','ионными связями'], a:1, expl:'Это вторая основная вторичная структура после α-спирали.'},
  {sec:'s3', q:'β-Складчатый слой бывает:', opts:['только параллельным','параллельным и антипараллельным','только правым','только спиральным'], a:1, expl:'Два варианта взаимной ориентации цепей.'},
  {sec:'s3', q:'Обратимую денатурацию наблюдают, например, у:', opts:['яичного альбумина','трипсина и химотрипсиногена при 50 °C','коллагена','казеина'], a:1, expl:'Такая денатурация характеризуется константой равновесия.'},
  {sec:'s3', q:'Теплота денатурации белка обозначается как:', opts:['ΔG','ΔH','ΔS','Km'], a:1, expl:'ΔH — энтальпия, она же теплота денатурации; ΔS — энтропия, ΔG — свободная энергия.'},
  {sec:'s3', q:'В кислой среде белок заряжается:', opts:['отрицательно','положительно','не заряжается','заряд зависит только от температуры'], a:1, expl:'Белок амфотерен: в кислой среде заряд положительный, в щелочной — отрицательный.'},
  {sec:'s3', q:'В щелочной среде белок заряжается:', opts:['положительно','отрицательно','нейтрально','заряд максимален'], a:1, expl:'Это следствие амфотерности белка.'},
  {sec:'s3', q:'Изоэлектрическое осаждение белков основано на том, что в ИЭТ:', opts:['растворимость максимальна','отталкивание молекул исчезает и растворимость минимальна','белок необратимо денатурирует','заряд максимален'], a:1, expl:'Без взаимного отталкивания молекулы слипаются и выпадают.'},
  {sec:'s3', q:'Активный центр связывает субстрат так, что атакуемая связь:', opts:['не изменяется','оказывается напряжённой','сразу разрывается','удлиняется вдвое'], a:1, expl:'Напряжение связи и облегчает реакцию.'},
  {sec:'s3', q:'Оптимум pH пепсина составляет около:', opts:['1,5–2','5','7','8'], a:0, expl:'Пепсин работает в сильнокислой среде желудка.'},
  {sec:'s3', q:'Оптимум pH трипсина составляет около:', opts:['2','4','6','8'], a:3, expl:'В отличие от пепсина, трипсин работает в щелочной среде.'},
  {sec:'s3', q:'Конкурентный ингибитор фермента:', opts:['похож на субстрат и борется за активный центр','связывается в другом месте фермента','разрушает фермент','меняет pH среды'], a:0, expl:'Отсюда и название — он конкурирует с субстратом.'},
  {sec:'s3', q:'Неконкурентный ингибитор фермента:', opts:['похож на субстрат','садится не в активный центр, а в другое место','ускоряет реакцию','является коферментом'], a:1, expl:'Он не борется за активный центр.'},
  {sec:'s3', q:'Всего выделяют классов ферментов:', opts:['3','4','6','10'], a:2, expl:'Оксидоредуктазы, трансферазы, гидролазы, лиазы, изомеразы, лигазы.'},
  {sec:'s3', q:'Ферменты, переносящие группы, относятся к классу:', opts:['гидролаз','трансфераз','лиаз','лигаз'], a:1, expl:'Трансферазы — перенос групп.'},
  {sec:'s3', q:'Амилазы, протеазы и липазы относятся к классу:', opts:['оксидоредуктаз','гидролаз','изомераз','лигаз'], a:1, expl:'Все они ведут гидролиз.'},
  {sec:'s3', q:'К коферментам относятся:', opts:['НАД, ФАД, тиаминдифосфат','глюкоза и фруктоза','глицерин и вода','натрий и калий'], a:0, expl:'Многим ферментам нужны именно эти кофакторы.'},
  {sec:'s3', q:'Переход α- и β-аномеров друг в друга в растворе называется:', opts:['инверсией','мутаротацией','клейстеризацией','денатурацией'], a:1, expl:'Мутаротация — взаимопревращение аномеров.'},
  {sec:'s3', q:'Аномеры различаются положением OH-группы у:', opts:['любого углерода','аномерного углерода','атома азота','кислорода кольца'], a:1, expl:'Именно у аномерного углерода.'},
  {sec:'s3', q:'Свойства полисахарида определяет прежде всего:', opts:['длина цепи','тип гликозидной связи (α- или β-)','цвет','растворимость в спирте'], a:1, expl:'Отсюда и разница между крахмалом и целлюлозой.'},
  {sec:'s3', q:'Амилоза с йодом даёт окрашивание:', opts:['красное','синее','жёлтое','зелёное'], a:1, expl:'На этом основана йодная проба на крахмал.'},
  {sec:'s3', q:'Точки ветвления амилопектина образованы связями:', opts:['α-1,4','α-1,6','β-1,4','пептидными'], a:1, expl:'В линейных участках α-1,4, в точках ветвления α-1,6.'},
  {sec:'s3', q:'Клейстеризация с точки зрения структуры — это:', opts:['обратная рекристаллизация','разрушение кристаллической упорядоченности зёрен и набухание','гидролиз до глюкозы','окисление крахмала'], a:1, expl:'Обратная рекристаллизация — это ретроградация.'},
  {sec:'s3', q:'Ретроградация касается прежде всего:', opts:['амилопектина','амилозы','целлюлозы','пектина'], a:1, expl:'Ретроградация — обратная рекристаллизация, прежде всего амилозы.'},
  {sec:'s3', q:'Стадия инициирования при окислении жира — это:', opts:['образование свободного радикала R•','распад гидроперекиси','соединение радикалов','появление альдегидов'], a:0, expl:'С появления первого радикала цепь и начинается.'},
  {sec:'s3', q:'Обрыв цепи при окислительном прогоркании — это:', opts:['образование нового радикала','соединение радикалов друг с другом','присоединение кислорода','гидролиз жира'], a:1, expl:'Радикалы соединяются, и цепь прекращается.'},
  {sec:'s3', q:'Гидроперекиси при окислении жира — это продукты:', opts:['первичные','вторичные','конечные','побочные'], a:0, expl:'Они затем распадаются на вторичные — альдегиды и кетоны.'},
  {sec:'s3', q:'Йодное число жира характеризует:', opts:['свободные жирные кислоты','степень ненасыщенности','гидроперекиси','среднюю молекулярную массу кислот'], a:1, expl:'Йод присоединяется по двойным связям.'},
  {sec:'s3', q:'Число омыления характеризует:', opts:['степень ненасыщенности','среднюю молекулярную массу жирных кислот','гидроперекиси','свободные жирные кислоты'], a:1, expl:'Это показатель средней молекулярной массы кислот.'},
  {sec:'s3', q:'Антиоксиданты обрывают цепь окисления, потому что:', opts:['связывают кислород','отдают водород пероксирадикалу','повышают pH','охлаждают жир'], a:1, expl:'Так работают токоферолы.'},
  {sec:'s3', q:'Синергисты антиоксидантов (лимонная, аскорбиновая кислоты) действуют, потому что:', opts:['отдают водород радикалу','связывают ионы металлов-катализаторов','повышают температуру','разрушают перекиси'], a:1, expl:'Металлы катализируют окисление, синергисты их связывают.'},
  {sec:'s3', q:'Коферментной формой витамина B1 является:', opts:['ФАД','тиаминдифосфат','НАД','пиридоксальфосфат'], a:1, expl:'B1 → тиаминдифосфат.'},
  {sec:'s3', q:'Коферментной формой витамина B2 является:', opts:['НАД','ФАД/ФМН','тиаминдифосфат','пиридоксальфосфат'], a:1, expl:'B2 → ФАД/ФМН.'},
  {sec:'s3', q:'Коферментной формой витамина PP является:', opts:['НАД','ФАД','тиаминдифосфат','пиридоксальфосфат'], a:0, expl:'PP → НАД.'},
  {sec:'s3', q:'Коферментной формой витамина B6 является:', opts:['НАД','ФАД','пиридоксальфосфат','тиаминдифосфат'], a:2, expl:'B6 → пиридоксальфосфат.'},
  {sec:'s3', q:'Витамин C при окислении переходит в:', opts:['дегидроаскорбиновую кислоту','щавелевую кислоту','глюкозу','токоферол'], a:0, expl:'Потому он и разрушается на воздухе и в щёлочи.'},

const LEVELS = {
  base: { id:'base', name:'База',        theory:THEORY,     questions:QUESTIONS,     key:'bioteh-exam-v2:base' },
  adv:  { id:'adv',  name:'Продвинутый', theory:THEORY_ADV, questions:QUESTIONS_ADV, key:'bioteh-exam-v2:adv'  }
};
const KEY_LEVEL = 'bioteh-exam-v2:level';
const KEY_FS = 'bioteh-exam-v2:fs';
const MIX_SIZE = 20;
// Банк вопросов большой, поэтому в один тест берём случайную выборку —
// при каждом заходе вопросы новые, а занятие остаётся посильным по длине.
const SEC_SIZE = 25;

let level = (store.get(KEY_LEVEL) === 'adv') ? 'adv' : 'base';
const L = () => LEVELS[level];
const theory = () => L().theory;
const questions = () => L().questions;

/* =========================================================================
   Прогресс — раздельный по уровням
   ========================================================================= */
const progress = { base:null, adv:null };

function loadProgress(lv){
  const empty = { read:{}, best:{} };
  try {
    const raw = store.get(LEVELS[lv].key);
    if(!raw) return empty;
    const p = JSON.parse(raw);
    return {
      read: (p && typeof p.read === 'object' && p.read) ? p.read : {},
      best: (p && typeof p.best === 'object' && p.best) ? p.best : {}
    };
  } catch(e){ return empty; }
}
Object.keys(LEVELS).forEach(lv => { progress[lv] = loadProgress(lv); });

const P = () => progress[level];
function saveProgress(){
  try { store.set(L().key, JSON.stringify(P())); } catch(e){}
}
function markRead(id){
  if(P().read[id]) return false;
  P().read[id] = true;
  saveProgress();
  return true;
}
function recordBest(key, pct){
  const prev = P().best[key];
  if(typeof prev !== 'number' || pct > prev){
    P().best[key] = pct;
    saveProgress();
  }
}
function readCount(){ return theory().filter(s => P().read[s.id]).length; }
function averageScore(){
  const vals = Object.values(P().best).filter(v => typeof v === 'number');
  if(!vals.length) return null;
  return Math.round(vals.reduce((a,b) => a + b, 0) / vals.length);
}
function testsTaken(){
  return Object.values(P().best).filter(v => typeof v === 'number').length;
}

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function sectionById(id){ return theory().find(s => s.id === id); }
function questionsFor(id){ return questions().filter(q => q.sec === id); }
function plural(n, one, few, many){
  const n10 = n % 10, n100 = n % 100;
  if(n10 === 1 && n100 !== 11) return one;
  if(n10 >= 2 && n10 <= 4 && (n100 < 12 || n100 > 14)) return few;
  return many;
}
function shortTitle(t){
  const m = t.match(/^Раздел\s+(\d+)/);
  return m ? 'Раздел ' + m[1] : t;
}
